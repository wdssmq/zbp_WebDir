<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>WebDir - {$name}</title>
    <link rel="stylesheet" href="https://cdn.bootcss.com/bootstrap/3.3.0/css/bootstrap.min.css">
    <style type="text/css">
        body {
            background-color: #F1F1FA;
        }

        .container {
            margin-top: 59px;
            margin-bottom: 59px;
            border-radius: 15px;
            background-color: #FFFFFF;
            padding-bottom: 13px;
        }

        .table {
            table-layout: fixed;
        }

        th:not(:first-child),
        td:not(:first-child) {
            width: 193px;
        }

        td>* {
            display: inline-block;
            width: 102%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
    </style>
</head>
<!--
/**
 * 
 * 主体代码修改自：maysrp/webdir: 网站目录
 * 主体代码修改自：https://github.com/maysrp/webdir
 * 当前文件作者：沉冰浮水
 * 当前作者主页：https://www.wdssmq.com
 *
 **/
-->
<body>
    <div class="container">
        <div class="row">
            <div class="col-md-1 text-center">
                <h2>
                    <a class="btn btn-primary" href="{if isset($_SERVER['HTTP_REFERER'])}{$_SERVER['HTTP_REFERER']}{/if}"
                        title="返回">
                        <span class="glyphicon glyphicon-chevron-left"></span>
                    </a>
                </h2>
            </div>
            <div class="col-md-9">
                <h3>
                </h3>
            </div>
            <div class="col-md-2">
                <h2 class="text-right">
                    <a class="btn btn-primary" href="{$host}" title="主页">
                        <span class="glyphicon glyphicon-home"></span>
                    </a>
                    <a class="btn btn-primary" href="{$host}zb_users/plugin/WebDir/main.php" title="管理">
                        <span class="glyphicon glyphicon glyphicon-tasks"></span>
                    </a>&nbsp;
                </h2>
            </div>
        </div>
        <table class="table table-striped table-bordered table-hover">
            <tr>
                <th>文件名</th>
                <th>大小</th>
                <th>时间</th>
                <th class="text-center">下载</th>
            </tr>
            {foreach $dirs as $dir}
            <tr>
                <td><a href="{$dir.url}"><span class="{$dir.icon}">{$dir.name}</span></a></td>
                <td>{$dir.size}</td>
                <td>{$dir.mtime}</td>
                <td></td>
            </tr>
            {/foreach}
            {foreach $files as $file}
            <tr>
                <td><a href="{$file.url}" title="{$file.name}" onclick="return false;"><span class="{$file.icon}">{$file.name}</span></a></td>
                <td>{$file.size}</td>
                <td>{$file.mtime}</td>
                <td class="text-center"><a href="{$file.download}" download="{$file.name}"><span class="glyphicon glyphicon-download-alt"></span></a></td>
            </tr>
            {/foreach}
        </table>
        <p class="text-center">{$copyright}</p>
        <p class="text-center">Powered By <a href="//www.zblogcn.com/" rel="nofollow" title="Z-BlogPHP" target="_blank">Z-BlogPHP</a>
            & <a href="https://app.zblogcn.com/?id=1859" target="_blank" title="WebDir For ZBP" rel="nofollow">WebDir
                For ZBP</a></p>
    </div>
    <script src="{$host}zb_system/script/jquery-2.2.4.min.js" type="text/javascript"></script>
    <script src="{$host}zb_system/script/zblogphp.js" type="text/javascript"></script>
    <script src="{$host}zb_system/script/c_html_js_add.php" type="text/javascript"></script>
    {$footer}
</body>

</html>
